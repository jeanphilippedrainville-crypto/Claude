<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Vin Vivant — A Natural Wine Bar Idle Game</title>
<style>
  /* ----------  Design tokens (carried from Glou Glou)  ---------- */
  :root{
    --paper:#f4ead7; --paper-2:#ece0c6;
    --ink:#2b1a12; --ink-soft:#6b5544;
    --orange:#e08a2f; --orange-deep:#c66a1d;
    --glou:#9c2a3b; --glou-deep:#6f1626;
    --plum:#5b2a52; --gold:#d8a93a; --green:#5a7d4a; --sky:#7fa8b8;
    --shadow:rgba(43,26,18,.18);
    --radius:18px;
    --font:"Georgia","Iowan Old Style",serif;
    --font-disp:"Bodoni 72","Didot","Playfair Display",Georgia,serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--font);color:var(--ink);
    background:
      radial-gradient(1200px 700px at 80% -10%, #f7efe0 0%, transparent 60%),
      radial-gradient(900px 600px at -10% 110%, #efe2c7 0%, transparent 55%),
      linear-gradient(160deg,#f0e4cd 0%, #e7d8ba 100%);
    background-attachment:fixed;-webkit-font-smoothing:antialiased;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}

  .wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:16px 16px 40px;}

  /* Header */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .brand h1{font-family:var(--font-disp);font-size:clamp(28px,6vw,44px);margin:0;letter-spacing:.5px;
    font-weight:800;font-style:italic;color:var(--glou-deep);text-shadow:1px 1px 0 #fff7;line-height:1}
  .brand .tag{font-size:12px;color:var(--ink-soft);letter-spacing:3px;text-transform:uppercase;margin-top:4px}
  .tools{display:flex;gap:6px;flex-wrap:wrap}
  .tbtn{cursor:pointer;background:var(--paper);border:1.5px solid #d8c6a3;border-radius:999px;
    padding:7px 12px;font-size:13px;box-shadow:0 2px 0 var(--shadow);color:var(--ink);font-family:var(--font)}
  .tbtn:hover{border-color:var(--orange)}
  .tbtn:active{transform:translateY(1px)}

  /* Layout */
  .grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
  @media(max-width:780px){.grid{grid-template-columns:1fr}}

  .card{background:var(--paper);border:2px solid #d8c6a3;border-radius:var(--radius);
    box-shadow:0 14px 30px -16px var(--shadow), inset 0 1px 0 #fff8;padding:16px;position:relative}

  /* Left: the bar */
  .bar-scene{font-size:26px;line-height:1.5;min-height:40px;letter-spacing:2px;margin-bottom:6px;
    text-align:center;filter:drop-shadow(0 2px 0 var(--shadow))}
  .stat{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed #d8c6a3;padding:7px 2px}
  .stat:last-of-type{border-bottom:none}
  .stat .k{font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1px}
  .stat .v{font-family:var(--font-disp);font-style:italic;font-variant-numeric:tabular-nums}
  .glou-big{font-size:clamp(30px,7vw,42px);color:var(--glou-deep);text-align:center;margin:6px 0 2px;
    font-family:var(--font-disp);font-style:italic;font-variant-numeric:tabular-nums;line-height:1}
  .cps{text-align:center;color:var(--ink-soft);font-size:14px;margin-bottom:12px}

  .pour{position:relative;width:100%;cursor:pointer;border:none;color:#fff7e8;
    font-family:var(--font-disp);font-style:italic;font-weight:700;font-size:24px;letter-spacing:.5px;
    background:linear-gradient(160deg,var(--glou),var(--glou-deep));
    padding:18px;border-radius:16px;box-shadow:0 7px 0 var(--glou-deep),0 14px 22px -10px var(--shadow);
    transition:transform .06s, box-shadow .06s;overflow:visible}
  .pour:active{transform:translateY(5px);box-shadow:0 2px 0 var(--glou-deep)}
  .pour small{display:block;font-family:var(--font);font-style:normal;font-size:12px;opacity:.85;margin-top:3px;letter-spacing:1px}

  .prestige{margin-top:12px;width:100%;cursor:pointer;border:none;color:#3a2410;
    font-family:var(--font-disp);font-style:italic;font-weight:700;font-size:16px;
    background:linear-gradient(160deg,var(--gold),var(--orange));
    padding:12px;border-radius:14px;box-shadow:0 5px 0 var(--orange-deep),0 10px 18px -8px var(--shadow);
    transition:transform .06s, box-shadow .06s}
  .prestige:disabled{filter:grayscale(.6) opacity(.55);cursor:not-allowed;box-shadow:0 5px 0 var(--orange-deep)}
  .prestige:not(:disabled):active{transform:translateY(3px);box-shadow:0 2px 0 var(--orange-deep)}
  .terroir{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:8px}
  .terroir b{color:var(--plum)}

  /* floating +glou */
  .float{position:absolute;pointer-events:none;font-family:var(--font-disp);font-style:italic;
    font-size:20px;color:#fff;text-shadow:0 1px 3px #0006;animation:floaty 1s ease-out forwards;z-index:6}
  @keyframes floaty{0%{opacity:0;transform:translate(-50%,0) scale(.8)}
    20%{opacity:1}100%{opacity:0;transform:translate(-50%,-70px) scale(1.1)}}

  /* Perfect-pour timing meter (inside the pour button) */
  .meter{position:relative;display:block;height:14px;margin:12px 6px 0;border-radius:999px;
    background:rgba(255,255,255,.22);overflow:hidden;border:1px solid rgba(255,255,255,.35)}
  .meter .zone{position:absolute;top:0;bottom:0}
  .zone-good{left:34%;width:32%;background:rgba(255,255,255,.32)}
  .zone-perfect{left:46%;width:8%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
  .marker{position:absolute;top:-2px;bottom:-2px;width:4px;left:50%;
    background:#fff;border-radius:2px;box-shadow:0 0 7px #fff}
  .streak{text-align:center;font-size:13px;color:var(--orange-deep);min-height:18px;
    margin-top:7px;font-weight:700;font-family:var(--font-disp);font-style:italic}

  /* Golden "Glou Glou" bottle */
  .golden{position:fixed;left:0;top:30vh;font-size:46px;cursor:pointer;z-index:50;user-select:none;
    filter:drop-shadow(0 0 12px var(--gold));animation:drift linear forwards;will-change:transform}
  @keyframes drift{
    0%{transform:translate(-12vw,0) rotate(0deg);opacity:0}
    8%{opacity:1}92%{opacity:1}
    100%{transform:translate(112vw,-10vh) rotate(40deg);opacity:0}}

  /* Frenzy banner */
  .frenzy-banner{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:35;
    background:linear-gradient(90deg,var(--glou),var(--orange));color:#fff7e8;
    padding:8px 18px;border-radius:999px;font-family:var(--font-disp);font-style:italic;
    box-shadow:0 6px 16px -6px #0007;font-size:15px;letter-spacing:.5px;
    animation:pulseB 1s ease-in-out infinite}
  @keyframes pulseB{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}

  /* Right: tabs + shop */
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .tab{cursor:pointer;border:1.5px solid #d8c6a3;background:var(--paper-2);border-radius:999px;
    padding:8px 16px;font-family:var(--font-disp);font-style:italic;font-size:16px;color:var(--ink-soft)}
  .tab.active{background:var(--glou);color:#fff7e8;border-color:var(--glou-deep);box-shadow:0 3px 0 var(--glou-deep)}
  .buymode{margin-left:auto;display:flex;gap:4px;align-items:center}
  .buymode span{font-size:12px;color:var(--ink-soft);margin-right:2px}
  .bm{cursor:pointer;border:1.5px solid #d8c6a3;background:#fffdf6;border-radius:8px;padding:5px 10px;font-size:13px;font-family:var(--font)}
  .bm.active{background:var(--orange);color:#fff;border-color:var(--orange-deep)}

  .row{display:flex;align-items:center;gap:12px;padding:11px;border:1.5px solid #e0cfa9;border-radius:13px;
    background:#fffdf6;margin-bottom:9px;transition:border-color .12s, background .12s;position:relative}
  .row.afford{border-color:var(--green)}
  .row.locked{opacity:.55}
  .row .emoji{font-size:30px;flex:0 0 auto;width:40px;text-align:center}
  .row .body{flex:1;min-width:0}
  .row .name{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .row .owned{font-family:var(--font-disp);font-style:italic;color:var(--orange-deep);font-size:15px}
  .row .desc{font-size:12.5px;color:var(--ink-soft);line-height:1.35;margin-top:2px}
  .row .rate{font-size:12px;color:var(--green);margin-top:2px;font-variant-numeric:tabular-nums}
  .buy{cursor:pointer;border:none;color:#fff7e8;background:linear-gradient(160deg,var(--glou),var(--glou-deep));
    border-radius:11px;padding:10px 12px;font-family:var(--font-disp);font-style:italic;font-weight:700;
    font-size:14px;min-width:96px;text-align:center;box-shadow:0 4px 0 var(--glou-deep);transition:transform .06s,box-shadow .06s,filter .12s}
  .buy:disabled{filter:grayscale(.7) opacity(.5);cursor:not-allowed}
  .buy:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 var(--glou-deep)}
  .buy .c{display:block;font-family:var(--font);font-style:normal;font-size:12px;font-weight:400;opacity:.9}

  .ach{display:inline-flex;align-items:center;gap:6px;background:#fffdf6;border:1.5px solid #e0cfa9;
    border-radius:999px;padding:6px 12px;margin:0 6px 8px 0;font-size:13px}
  .ach.locked{opacity:.4;filter:grayscale(1)}
  .ach .e{font-size:16px}
  .statline{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px dashed #d8c6a3;font-size:14px}
  .statline .v{font-variant-numeric:tabular-nums;font-family:var(--font-disp);font-style:italic}
  .muted-note{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-top:10px}

  /* Toast */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:14px;
    font-family:var(--font-disp);font-style:italic;font-size:18px;opacity:0;pointer-events:none;z-index:30;
    box-shadow:0 10px 30px -8px #0008;text-align:center;max-width:90%}
  .toast small{display:block;font-family:var(--font);font-style:normal;font-size:12.5px;opacity:.85;margin-top:3px}
  .toast.show{animation:toastUp 2.4s ease forwards}
  @keyframes toastUp{0%{opacity:0;transform:translateX(-50%) translateY(20px)}
    10%{opacity:1;transform:translateX(-50%) translateY(0)}
    85%{opacity:1;transform:translateX(-50%) translateY(0)}
    100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}

  /* Overlay (welcome back / intro) */
  .overlay{position:fixed;inset:0;background:rgba(43,26,18,.55);z-index:40;display:flex;
    align-items:center;justify-content:center;padding:20px}
  .modal{background:var(--paper);border:2px solid #d8c6a3;border-radius:var(--radius);max-width:460px;
    padding:26px;text-align:center;box-shadow:0 20px 50px -12px #0009}
  .modal h2{font-family:var(--font-disp);font-style:italic;color:var(--glou-deep);margin:0 0 8px;font-size:30px}
  .modal p{color:var(--ink-soft);line-height:1.55;font-size:15px}
  .modal .big{font-family:var(--font-disp);font-style:italic;font-size:40px;color:var(--orange-deep);margin:8px 0}
  .modal .btn{cursor:pointer;border:none;color:#fff7e8;font-family:var(--font-disp);font-style:italic;font-weight:700;
    font-size:20px;background:linear-gradient(160deg,var(--glou),var(--glou-deep));padding:12px 30px;border-radius:999px;
    box-shadow:0 6px 0 var(--glou-deep);margin-top:14px}
  .modal .btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--glou-deep)}
  .modal .ghost{background:none;color:var(--ink-soft);box-shadow:none;border:1.5px solid #d8c6a3;font-size:15px;padding:9px 18px;margin-left:8px}
  .hidden{display:none!important}
  footer{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:18px;opacity:.8}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Vin&nbsp;Vivant</h1>
      <div class="tag">Grow a natural wine empire</div>
    </div>
    <div class="tools">
      <button class="tbtn" id="muteBtn" title="Sound">🔊</button>
      <button class="tbtn" id="exportBtn">Export</button>
      <button class="tbtn" id="importBtn">Import</button>
      <button class="tbtn" id="resetBtn">Reset</button>
    </div>
  </header>

  <div class="grid">
    <!-- LEFT: the bar -->
    <section class="card">
      <div class="bar-scene" id="barScene">🏠</div>
      <div class="glou-big"><span id="glou">0</span> ₲</div>
      <div class="cps" id="cps">0 ₲ / sec</div>
      <button class="pour" id="pourBtn"><span style="display:block">Pour a glass</span>
        <small id="perClick">+1 ₲ · time it for the gold!</small>
        <span class="meter"><span class="zone zone-good"></span><span class="zone zone-perfect"></span><span class="marker" id="marker"></span></span>
      </button>
      <div class="streak" id="streak"></div>
      <button class="prestige" id="prestigeBtn" disabled>Declare a New Vintage</button>
      <div class="terroir" id="terroir">Terroir points: <b>0 ★</b></div>

      <div style="margin-top:14px">
        <div class="stat"><span class="k">Per second</span><span class="v" id="s_cps">0</span></div>
        <div class="stat"><span class="k">Per pour</span><span class="v" id="s_click">1</span></div>
        <div class="stat"><span class="k">Terroir bonus</span><span class="v" id="s_bonus">+0%</span></div>
      </div>
    </section>

    <!-- RIGHT: shop -->
    <section class="card">
      <div class="tabs">
        <button class="tab active" data-tab="cellar">Cellar</button>
        <button class="tab" data-tab="upgrades">Upgrades <span id="upgDot"></span></button>
        <button class="tab" data-tab="stats">Almanac</button>
        <div class="buymode" id="buymode">
          <span>Buy</span>
          <button class="bm active" data-bm="1">×1</button>
          <button class="bm" data-bm="10">×10</button>
          <button class="bm" data-bm="max">Max</button>
        </div>
      </div>

      <div id="tab-cellar"></div>
      <div id="tab-upgrades" class="hidden"></div>
      <div id="tab-stats" class="hidden"></div>
    </section>
  </div>

  <footer>Made with 🍇 for a natural wine lover · progress saves automatically in your browser</footer>
</div>

<div class="toast" id="toast"></div>
<div class="frenzy-banner hidden" id="frenzyBanner"></div>

<!-- Welcome / offline overlay -->
<div class="overlay hidden" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ============================================================
   VIN VIVANT — a natural-wine idle game
   ============================================================ */
const $=id=>document.getElementById(id);
const R=1.15;                 // cost growth per purchase
const TICK=100;               // ms
const SAVE_KEY="vinvivant_save_v1";

/* ---------- Content: the cellar (generators) ---------- */
const GENS=[
  {id:"piquette", emoji:"💧", name:"Piquette Jug",          base:15,        rate:0.1,
    note:"Spritzy ~5% thirst-killer from re-soaked pressed pomace."},
  {id:"glouglou", emoji:"🍒", name:"Glou-Glou Carafe",      base:120,       rate:1,
    note:"Light, juicy, chillable red you drink by the litre."},
  {id:"petnat",   emoji:"🍾", name:"Pét-Nat Crate",         base:1300,      rate:8,
    note:"Méthode ancestrale fizz — bottled mid-ferment."},
  {id:"orange",   emoji:"🟠", name:"Skin-Contact Barrel",   base:14000,     rate:47,
    note:"White grapes on their skins → funky, grippy orange wine."},
  {id:"bio",      emoji:"🌙", name:"Biodynamic Plot",       base:160000,    rate:260,
    note:"Vines farmed by the moon and the cosmos."},
  {id:"amphora",  emoji:"🏺", name:"Amphora / Qvevri",      base:1900000,   rate:1400,
    note:"Buried clay vessels — Georgia's 8,000-year-old method."},
  {id:"wild",     emoji:"🦠", name:"Wild-Yeast Cellar",     base:26000000,  rate:7800,
    note:"Spontaneous ferments with only the yeast in the air."},
  {id:"cult",     emoji:"💎", name:"Cult Cuvée Allocation", base:400000000, rate:44000,
    note:"Tiny rare allocations the whole world fights over."},
  {id:"fair",     emoji:"🎪", name:"Natural Wine Fair",     base:6500000000,rate:260000,
    note:"Your own buzzing low-intervention wine fair."},
  {id:"estate",   emoji:"🏰", name:"Living Vineyard Estate",base:95000000000,rate:1600000,
    note:"The dream self-sustaining domaine. Terroir incarnate."},
];

/* ---------- Content: upgrades ---------- */
// type: click | global | gen(target)  ·  unlock: function(state)->bool
const UPG=[
  // click line
  {id:"u_click1", emoji:"✋", name:"Steady Hand",          cost:120,     type:"click", mult:2,
    desc:"Pour twice as much per glass.", unlock:s=>s.run>=60},
  {id:"u_click2", emoji:"🎩", name:"Hire a Sommelier",     cost:6000,    type:"click", mult:2,
    desc:"Your somm pours like a pro — ×2 per glass.", unlock:s=>s.run>=2500},
  {id:"u_click3", emoji:"🕯️", name:"Decanting Ritual",     cost:600000,  type:"click", mult:3,
    desc:"Theatrical decanting triples your pour.", unlock:s=>s.run>=250000},
  // per-generator (unlock at 10 owned), each ×2 that generator
  {id:"u_piq",  emoji:"💧", name:"Second Pressing",        cost:300,     type:"gen", target:"piquette", mult:2,
    desc:"Squeeze more from the pomace — Piquette ×2.", unlock:s=>s.gen.piquette>=10},
  {id:"u_glou", emoji:"❄️", name:"Chill Tank",            cost:2000,    type:"gen", target:"glouglou", mult:2,
    desc:"Serve it cold, sell it fast — Glou-Glou ×2.", unlock:s=>s.gen.glouglou>=10},
  {id:"u_pet",  emoji:"🌀", name:"Riddling Rack",         cost:20000,   type:"gen", target:"petnat", mult:2,
    desc:"Cleaner fizz, faster turnover — Pét-Nat ×2.", unlock:s=>s.gen.petnat>=10},
  {id:"u_org",  emoji:"⏳", name:"Extended Maceration",    cost:220000,  type:"gen", target:"orange", mult:2,
    desc:"More skin time, more funk — Skin-Contact ×2.", unlock:s=>s.gen.orange>=10},
  {id:"u_bio",  emoji:"📅", name:"Lunar Calendar",        cost:2600000, type:"gen", target:"bio", mult:2,
    desc:"Plant on root days — Biodynamic ×2.", unlock:s=>s.gen.bio>=10},
  {id:"u_amp",  emoji:"🐝", name:"Beeswax Seal",          cost:32000000,type:"gen", target:"amphora", mult:2,
    desc:"Seal the qvevri tight — Amphora ×2.", unlock:s=>s.gen.amphora>=10},
  // global line
  {id:"u_g1", emoji:"🚫", name:"No Added Sulphites",      cost:60000,     type:"global", mult:2,
    desc:"Purer, more alive, more sought-after — ×2 everything.", unlock:s=>s.run>=22000},
  {id:"u_g2", emoji:"🗣️", name:"Word of Mouth",          cost:6000000,   type:"global", mult:2,
    desc:"Everyone's talking about your bar — ×2 everything.", unlock:s=>s.run>=2200000},
  {id:"u_g3", emoji:"📰", name:"Featured in a Wine Zine", cost:650000000, type:"global", mult:2,
    desc:"A cult review sends a stampede — ×2 everything.", unlock:s=>s.run>=220000000},
  {id:"u_g4", emoji:"🌍", name:"Cult Following",          cost:70000000000,type:"global", mult:3,
    desc:"A global low-intervention movement — ×3 everything.", unlock:s=>s.run>=22000000000},
];

/* ---------- Content: achievements ---------- */
const ACH=[
  {id:"a_first", emoji:"🍷", name:"First Pour",       cond:s=>s.life>=1},
  {id:"a_thirsty",emoji:"😋", name:"Getting Thirsty", cond:s=>s.run>=1000},
  {id:"a_open",  emoji:"🚪", name:"Bar's Open",       cond:s=>totalGens(s)>=10},
  {id:"a_bubbles",emoji:"🍾", name:"Bubbles Everywhere", cond:s=>s.gen.petnat>=50},
  {id:"a_funk",  emoji:"🟠", name:"Funk Lord",        cond:s=>s.gen.orange>=50},
  {id:"a_glou",  emoji:"🍒", name:"Glou Glou!",       cond:s=>s.run>=1e6},
  {id:"a_ancient",emoji:"🏺", name:"Ancient Ways",    cond:s=>s.gen.amphora>=25},
  {id:"a_million",emoji:"💰", name:"Millionaire",     cond:s=>s.glou>=1e6},
  {id:"a_click", emoji:"💪", name:"Pour Champion",    cond:s=>s.clicks>=250},
  {id:"a_vintage",emoji:"🍇", name:"New Vintage",     cond:s=>s.terroir>=1},
  {id:"a_terroir",emoji:"⭐", name:"Terroir Whisperer",cond:s=>s.terroir>=10},
  {id:"a_estate",emoji:"🏰", name:"Domaine Dreams",   cond:s=>s.gen.estate>=10},
  {id:"a_empire",emoji:"👑", name:"Living Legend",    cond:s=>s.run>=1e9},
];

/* ---------- State ---------- */
let state, buyMode="1", muted=false, activeTab="cellar";
let streak=0, currentPos=50, markerEl=null, meterStart=0;     // perfect-pour meter
let frenzy={prod:1,click:1,until:0}, goldT=null;              // golden-bottle frenzies
const frenzyOn=()=>Date.now()<frenzy.until;

function freshState(){
  const gen={}; GENS.forEach(g=>gen[g.id]=0);
  return {
    glou:0, run:0, life:0, clicks:0,
    gen, upg:{}, ach:{}, terroir:0,
    lastSave:Date.now(),
  };
}
function totalGens(s){return GENS.reduce((a,g)=>a+s.gen[g.id],0);}

/* ---------- Save / load ---------- */
function save(){ state.lastSave=Date.now(); try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){} }
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const s=JSON.parse(raw);
    state=Object.assign(freshState(),s);
    state.gen=Object.assign(freshState().gen, s.gen||{});
    state.upg=s.upg||{}; state.ach=s.ach||{};
    return true;
  }catch(e){ return false; }
}

/* ---------- Number formatting ---------- */
const SUFFIX=["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc"];
function fmt(n){
  if(n<0) return "-"+fmt(-n);
  if(n<1000){ return (n>=10||Number.isInteger(n))?Math.floor(n).toString():n.toFixed(1); }
  let t=0; while(n>=1000 && t<SUFFIX.length-1){ n/=1000; t++; }
  return n.toFixed(n<10?2:n<100?1:0)+SUFFIX[t];
}

/* ---------- Economy ---------- */
function genMult(g){
  let m=1;
  UPG.forEach(u=>{ if(u.type==="gen" && u.target===g.id && state.upg[u.id]) m*=u.mult; });
  return m;
}
function globalMult(){
  let m=1;
  UPG.forEach(u=>{ if(u.type==="global" && state.upg[u.id]) m*=u.mult; });
  m*=(1+0.02*state.terroir);                  // terroir bonus
  m*=Math.pow(1.01, achCount());              // +1% per achievement
  if(frenzyOn()) m*=frenzy.prod;              // golden-bottle production frenzy
  return m;
}
function clickMult(){
  let m=1;
  UPG.forEach(u=>{ if(u.type==="click" && state.upg[u.id]) m*=u.mult; });
  return m;
}
function genCps(g){ return g.rate*state.gen[g.id]*genMult(g)*globalMult(); }
function cps(){ return GENS.reduce((a,g)=>a+genCps(g),0); }
function clickValue(){ return 1*clickMult()*globalMult()*(frenzyOn()?frenzy.click:1); }
function achCount(){ return ACH.reduce((a,x)=>a+(state.ach[x.id]?1:0),0); }

// cost of buying `k` of generator `g` given current owned count
function costOf(g,k){
  const c=state.gen[g.id];
  const total=g.base*Math.pow(R,c)*(Math.pow(R,k)-1)/(R-1);
  return Math.ceil(total);
}
function maxAffordable(g){
  const c=state.gen[g.id];
  const k=Math.floor(Math.log(state.glou*(R-1)/(g.base*Math.pow(R,c))+1)/Math.log(R));
  return Math.max(0,k);
}
function buyQty(g){
  if(buyMode==="max") return Math.max(1,maxAffordable(g));
  return parseInt(buyMode,10);
}

/* ---------- Prestige ---------- */
function pendingTerroir(){ return Math.max(0, Math.floor(Math.sqrt(state.run/1e6)) - state.terroir); }
function canPrestige(){ return state.run>=1e6 && pendingTerroir()>0; }
function doPrestige(){
  const gain=pendingTerroir();
  if(gain<=0) return;
  if(!confirm(`Declare a New Vintage?\n\nYou'll reset your ₲, cellar and upgrades, but gain ${gain} ★ terroir point${gain>1?"s":""} (a permanent +${gain*2}% to all production). Terroir, achievements and settings are kept.`)) return;
  const keepTerroir=state.terroir+gain, keepAch=state.ach;
  state=freshState();
  state.terroir=keepTerroir; state.ach=keepAch;
  sndPrestige();
  toast("🍇 New Vintage declared!", `+${gain} ★ · now +${keepTerroir*2}% forever`);
  fullRender(); save();
}

/* ---------- Actions ---------- */
function pour(ev){
  // score the timing: where is the marker right now?
  const d=Math.abs(currentPos-50);
  let label,mult;
  if(d<=4){ label="Perfect Pour! "; mult=8; }
  else if(d<=16){ label="Nice pour "; mult=3; }
  else { label=""; mult=1; }
  if(mult>1) streak++; else streak=0;
  const streakBonus=1+Math.min(streak,20)*0.1;          // up to ×3 at a 20 streak
  const v=clickValue()*mult*streakBonus;
  state.glou+=v; state.run+=v; state.life+=v; state.clicks++;
  spawnFloat(ev, label+"+"+fmt(v));
  if(mult>=8) sndPerfect(); else if(mult>=3) sndBuy(); else sndPour();
  updateStreak();
  updateTop();
}
function updateStreak(){
  const el=$("streak"); if(!el) return;
  el.textContent = streak>=2
    ? `🔥 ${streak} pour streak · +${Math.round(Math.min(streak,20)*10)}% per pour`
    : "";
}
function buyGen(g){
  const k=buyQty(g), price=costOf(g,k);
  if(k<=0 || state.glou<price) return;
  state.glou-=price; state.gen[g.id]+=k;
  sndBuy();
  fullRender();
}
function buyUpg(u){
  if(state.upg[u.id] || state.glou<u.cost || !u.unlock(state)) return;
  state.glou-=u.cost; state.upg[u.id]=true;
  sndUpg();
  toast(u.emoji+" "+u.name, u.desc);
  fullRender();
}

/* ---------- Render ---------- */
let genRows={}, lastUpgSig="", lastSceneSig="";

function buildCellar(){
  const box=$("tab-cellar"); box.innerHTML=""; genRows={};
  GENS.forEach((g,i)=>{
    const row=document.createElement("div");
    row.className="row"; row.dataset.id=g.id;
    row.innerHTML=`
      <div class="emoji">${g.emoji}</div>
      <div class="body">
        <div class="name">${g.name} <span class="owned" data-owned>×0</span></div>
        <div class="desc">${g.note}</div>
        <div class="rate" data-rate></div>
      </div>
      <button class="buy" data-buy>Buy<span class="c" data-cost></span></button>`;
    row.querySelector("[data-buy]").addEventListener("click",()=>buyGen(g));
    box.appendChild(row);
    genRows[g.id]=row;
  });
}
function updateCellar(){
  GENS.forEach((g,i)=>{
    const row=genRows[g.id]; if(!row) return;
    const owned=state.gen[g.id];
    const unlocked = i===0 || state.gen[GENS[i-1].id]>0 || owned>0;
    row.style.display=unlocked?"":"none";
    if(!unlocked) return;
    const k=buyQty(g), price=costOf(g,k);
    row.querySelector("[data-owned]").textContent="×"+owned;
    row.querySelector("[data-rate]").textContent= owned>0
      ? `producing ${fmt(genCps(g))} ₲/s  ·  +${fmt(g.rate*genMult(g)*globalMult())} ₲/s each`
      : `each: +${fmt(g.rate*genMult(g)*globalMult())} ₲/s`;
    const btn=row.querySelector("[data-buy]");
    btn.firstChild.textContent = buyMode==="max" ? `Buy ×${k} ` : `Buy ×${k} `;
    row.querySelector("[data-cost]").textContent=fmt(price)+" ₲";
    const can=state.glou>=price && k>0;
    btn.disabled=!can;
    row.classList.toggle("afford",can);
  });
}

function renderUpgrades(){
  const box=$("tab-upgrades");
  const visible=UPG.filter(u=>!state.upg[u.id] && u.unlock(state));
  const sig=visible.map(u=>u.id).join(",");
  if(sig!==lastUpgSig){
    lastUpgSig=sig;
    box.innerHTML = visible.length? "" :
      `<p class="muted-note">No upgrades available yet — sell more wine and grow your cellar to unlock improvements. 🍷</p>`;
    visible.forEach(u=>{
      const row=document.createElement("div");
      row.className="row"; row.dataset.id=u.id;
      const tag = u.type==="click"?"per pour": u.type==="global"?"all production":"this wine";
      row.innerHTML=`
        <div class="emoji">${u.emoji}</div>
        <div class="body">
          <div class="name">${u.name} <span class="owned">×${u.mult} ${tag}</span></div>
          <div class="desc">${u.desc}</div>
        </div>
        <button class="buy" data-buy>Buy<span class="c">${fmt(u.cost)} ₲</span></button>`;
      row.querySelector("[data-buy]").addEventListener("click",()=>buyUpg(u));
      box.appendChild(row);
    });
  }
  // affordability refresh
  [...box.children].forEach(row=>{
    const u=UPG.find(x=>x.id===row.dataset.id); if(!u) return;
    const can=state.glou>=u.cost;
    const btn=row.querySelector("[data-buy]"); if(btn) btn.disabled=!can;
    row.classList.toggle("afford",can);
  });
  // dot indicator on tab
  const affordable=visible.some(u=>state.glou>=u.cost);
  $("upgDot").textContent=affordable?"🔴":"";
}

function renderStats(){
  const box=$("tab-stats");
  const playMins=0;
  box.innerHTML=`
    <div class="statline"><span>Total ₲ this vintage</span><span class="v">${fmt(state.run)} ₲</span></div>
    <div class="statline"><span>Lifetime ₲ (all vintages)</span><span class="v">${fmt(state.life)} ₲</span></div>
    <div class="statline"><span>Glasses poured by hand</span><span class="v">${fmt(state.clicks)}</span></div>
    <div class="statline"><span>Bottles in the cellar</span><span class="v">${fmt(totalGens(state))}</span></div>
    <div class="statline"><span>Terroir points</span><span class="v">${state.terroir} ★ (+${state.terroir*2}%)</span></div>
    <div class="statline"><span>Achievement bonus</span><span class="v">+${(Math.pow(1.01,achCount())*100-100).toFixed(0)}% (${achCount()}/${ACH.length})</span></div>
    <h3 style="font-family:var(--font-disp);font-style:italic;color:var(--glou-deep);margin:16px 0 8px">Achievements</h3>
    <div id="achBox"></div>
    <p class="muted-note">Tip: progress saves automatically every few seconds. Closing the tab is fine —
    your bar keeps earning while you're away (up to 8 hours), and you'll get a welcome-back summary.</p>`;
  const ab=$("achBox");
  ACH.forEach(a=>{
    const got=!!state.ach[a.id];
    const el=document.createElement("span");
    el.className="ach"+(got?"":" locked");
    el.innerHTML=`<span class="e">${got?a.emoji:"🔒"}</span> ${a.name}`;
    ab.appendChild(el);
  });
}

function updateScene(){
  // show one emoji per owned generator type, scaling a little with totals
  const owned=GENS.filter(g=>state.gen[g.id]>0);
  const sig=owned.map(g=>g.id).join(",");
  if(sig!==lastSceneSig){
    lastSceneSig=sig;
    $("barScene").textContent = owned.length? owned.map(g=>g.emoji).join(" ") : "🏠";
  }
}

function updateTop(){
  $("glou").textContent=fmt(state.glou);
  const c=cps();
  $("cps").textContent=fmt(c)+" ₲ / sec";
  $("s_cps").textContent=fmt(c);
  $("s_click").textContent=fmt(clickValue());
  $("s_bonus").textContent="+"+(state.terroir*2)+"%";
  $("perClick").textContent="+"+fmt(clickValue())+" ₲ base · hit the gold!";
  // prestige button
  const pend=pendingTerroir();
  const pb=$("prestigeBtn");
  pb.disabled=!canPrestige();
  pb.textContent = state.run>=1e6
    ? (pend>0 ? `Declare a New Vintage (+${pend} ★)` : `New Vintage at ${fmt(Math.pow(state.terroir+1,2)*1e6)} ₲`)
    : `New Vintage unlocks at 1M ₲`;
  $("terroir").innerHTML=`Terroir points: <b>${state.terroir} ★</b>`;
}

function fullRender(){
  updateScene(); updateCellar(); renderUpgrades();
  if(activeTab==="stats") renderStats();
  updateTop();
}

/* ---------- Achievements check ---------- */
function checkAch(){
  ACH.forEach(a=>{
    if(!state.ach[a.id] && a.cond(state)){
      state.ach[a.id]=true;
      sndAch();
      toast("🏆 Achievement: "+a.name, a.emoji+"  +1% production forever");
      if(activeTab==="stats") renderStats();
    }
  });
}

/* ---------- Main loop ---------- */
function tick(){
  const gain=cps()*(TICK/1000);
  if(gain>0){ state.glou+=gain; state.run+=gain; state.life+=gain; }
  checkAch();
  updateTop();
  updateFrenzy();
  // light per-tick affordability refresh
  if(activeTab==="cellar") updateCellar();
  else if(activeTab==="upgrades") renderUpgrades();
}

/* ---------- Offline earnings ---------- */
function applyOffline(){
  const now=Date.now();
  const dt=Math.min((now-(state.lastSave||now))/1000, 8*3600); // cap 8h
  if(dt>60){
    const earned=cps()*dt*0.5; // 50% efficiency while away
    if(earned>0){
      state.glou+=earned; state.run+=earned; state.life+=earned;
      showModal(`
        <h2>Bienvenue! 🍷</h2>
        <p>While you were away for <b>${humanTime(dt)}</b>, your natural wine bar kept pouring at half-pace and earned you</p>
        <div class="big">${fmt(earned)} ₲</div>
        <button class="btn" id="okBtn">Back to the bar</button>`);
    }
  }
}
function humanTime(s){
  s=Math.floor(s);
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60);
  if(h>0) return `${h}h ${m}m`;
  if(m>0) return `${m}m`;
  return `${s}s`;
}

/* ---------- Overlay / toast ---------- */
function showModal(html){ $("modal").innerHTML=html; $("overlay").classList.remove("hidden");
  const ok=$("okBtn"); if(ok) ok.addEventListener("click",()=>$("overlay").classList.add("hidden")); }
let toastT=null;
function toast(big,small){
  const t=$("toast");
  t.innerHTML=big+(small?`<small>${small}</small>`:"");
  t.classList.remove("show"); void t.offsetWidth; t.classList.add("show");
}
function spawnFloat(ev,txt){
  const btn=$("pourBtn"); const r=btn.getBoundingClientRect();
  const f=document.createElement("span"); f.className="float"; f.textContent=txt;
  const x=ev&&ev.clientX?ev.clientX-r.left:r.width/2;
  const y=ev&&ev.clientY?ev.clientY-r.top:r.height/2;
  f.style.left=x+"px"; f.style.top=y+"px";
  btn.appendChild(f); setTimeout(()=>f.remove(),1000);
}

/* ---------- Perfect-pour meter (sweeping marker) ---------- */
function meterLoop(ts){
  if(!meterStart) meterStart=ts;
  const P=Math.max(700, 1500 - Math.min(streak,18)*42);   // faster as your streak grows
  const phase=((ts-meterStart)%P)/P;
  currentPos=(phase<0.5 ? phase*2 : 2-phase*2)*100;        // triangle wave 0..100
  if(markerEl) markerEl.style.left=currentPos+"%";
  requestAnimationFrame(meterLoop);
}

/* ---------- Golden "Glou Glou" bottles ---------- */
const rand=(a,b)=>a+Math.random()*(b-a);
function scheduleGolden(){ clearTimeout(goldT); goldT=setTimeout(spawnGolden, rand(40,80)*1000); }
function spawnGolden(){
  const el=document.createElement("div");
  el.className="golden"; el.textContent=Math.random()<0.5?"🍾":"🌟";
  el.style.top=rand(12,72)+"vh";
  el.style.animationDuration=rand(9,13)+"s";
  let done=false;
  const finish=hit=>{ if(done) return; done=true; el.remove(); if(hit) rewardGolden(); scheduleGolden(); };
  el.addEventListener("click",()=>finish(true));
  el.addEventListener("animationend",()=>finish(false));
  document.body.appendChild(el);
}
function rewardGolden(){
  const roll=Math.random(), now=Date.now();
  if(roll<0.5){
    const gain=Math.max(13*cps(), 0.15*state.glou, clickValue()*25, 50);
    state.glou+=gain; state.run+=gain; state.life+=gain;
    toast("🍾 Glou Glou! Lucky pour","+"+fmt(gain)+" ₲");
  } else if(roll<0.8){
    frenzy={prod:7,click:7,until:now+15000};
    toast("🔥 Glou Glou Frenzy!","All production ×7 for 15s");
  } else {
    frenzy={prod:1,click:77,until:now+13000};
    toast("🌟 Tasting Frenzy!","Pours ×77 for 13s");
  }
  sndAch(); checkAch(); updateTop(); updateFrenzy();
}
function updateFrenzy(){
  const b=$("frenzyBanner");
  if(frenzyOn()){
    const s=((frenzy.until-Date.now())/1000).toFixed(1);
    b.textContent=(frenzy.click>=77 ? "🌟 Tasting Frenzy ×77" : "🔥 Glou Glou Frenzy ×7")+" · "+s+"s";
    b.classList.remove("hidden");
  } else b.classList.add("hidden");
}

/* ---------- Sound (tiny WebAudio, carried from Glou Glou) ---------- */
let actx=null;
function beep(freq,dur=0.1,type="sine",vol=0.1){
  if(muted) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type;o.frequency.value=freq;o.connect(g);g.connect(actx.destination);
    g.gain.setValueAtTime(vol,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
    o.start();o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sndPour=()=>beep(360+Math.random()*60,.05,"sine",.05);
const sndPerfect=()=>{[784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,.1,"triangle",.12),i*55));};
const sndBuy =()=>{beep(523,.07,"triangle");setTimeout(()=>beep(784,.09,"triangle"),60);};
const sndUpg =()=>{beep(659,.08,"triangle");setTimeout(()=>beep(988,.12,"triangle"),70);};
const sndAch =()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.12,"triangle"),i*80));};
const sndPrestige=()=>{[392,523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16,"sine",.12),i*100));};

/* ---------- Export / import / reset ---------- */
function exportSave(){
  save();
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(state))));
  prompt("Copy your save code (keep it safe — paste it into Import to restore on any device):", code);
}
function importSave(){
  const code=prompt("Paste a save code to load it:");
  if(!code) return;
  try{
    const s=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if(typeof s.glou!=="number") throw 0;
    state=Object.assign(freshState(),s);
    state.gen=Object.assign(freshState().gen,s.gen||{});
    lastUpgSig=""; lastSceneSig="";
    buildCellar(); fullRender(); save();
    toast("📥 Save loaded","Welcome back to your bar");
  }catch(e){ alert("That doesn't look like a valid save code."); }
}
function resetGame(){
  if(!confirm("Start completely over? This wipes your bar, cellar, upgrades, terroir and achievements. There's no undo.")) return;
  localStorage.removeItem(SAVE_KEY);
  state=freshState();
  lastUpgSig=""; lastSceneSig="";
  buildCellar(); fullRender();
  toast("🧹 Fresh start","A brand new bar awaits");
}

/* ---------- Wiring ---------- */
function switchTab(name){
  activeTab=name;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===name));
  $("tab-cellar").classList.toggle("hidden",name!=="cellar");
  $("tab-upgrades").classList.toggle("hidden",name!=="upgrades");
  $("tab-stats").classList.toggle("hidden",name!=="stats");
  if(name==="stats") renderStats();
  if(name==="cellar") updateCellar();
  if(name==="upgrades"){ lastUpgSig=""; renderUpgrades(); }
}

function init(){
  const had=load();
  if(!state) state=freshState();
  buildCellar();

  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>switchTab(t.dataset.tab)));
  document.querySelectorAll(".bm").forEach(b=>b.addEventListener("click",()=>{
    buyMode=b.dataset.bm;
    document.querySelectorAll(".bm").forEach(x=>x.classList.toggle("active",x===b));
    updateCellar();
  }));
  $("pourBtn").addEventListener("click",pour);
  markerEl=$("marker");
  requestAnimationFrame(meterLoop);
  scheduleGolden();
  // spacebar pours too (ignore when typing in a field)
  document.addEventListener("keydown",e=>{
    if(e.code==="Space" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
      e.preventDefault(); pour();
    }
  });
  $("prestigeBtn").addEventListener("click",doPrestige);
  $("exportBtn").addEventListener("click",exportSave);
  $("importBtn").addEventListener("click",importSave);
  $("resetBtn").addEventListener("click",resetGame);
  $("muteBtn").addEventListener("click",()=>{muted=!muted;$("muteBtn").textContent=muted?"🔇":"🔊";});

  fullRender();
  if(had) applyOffline();
  else showModal(`
    <h2>Welcome to Vin Vivant 🍇</h2>
    <p>You've got an empty room and a dream: build the world's most beloved
    <b>natural wine</b> bar. Pour glasses to earn ₲, then invest in low-intervention
    bottles — from humble piquette to a living vineyard estate — that pour for you automatically.</p>
    <p>Pouring is a <b>timing game</b>: tap when the sweeping marker hits the gold zone for a
    <b>Perfect Pour</b> and build a streak. Keep an eye out for golden <b>🍾 Glou Glou bottles</b>
    drifting by — click them for big bonuses and frenzies!</p>
    <p>Unlock upgrades, chase achievements, and when you're ready, declare a
    <b>New Vintage</b> to reset for permanent terroir bonuses. Santé!</p>
    <button class="btn" id="okBtn">Open the bar</button>`);

  setInterval(tick,TICK);
  setInterval(save,10000);
  window.addEventListener("beforeunload",save);
}
init();
</script>
</body>
</html>
