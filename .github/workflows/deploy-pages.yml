name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/natural-wine-game-6q2bw8
  workflow_dispatch:

# Allow this workflow to publish a Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; newer pushes cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Try to turn Pages on automatically if it isn't already
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repo root (index.html lives here)
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
